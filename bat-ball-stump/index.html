<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat Ball Stamp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Bat Ball Stamp</h1>
    <div class="container">
        <div class="img-container">
            <button id="bat" class="btn">
                <img src="bat.jpeg" alt="bat image">
            </button>

            <button id="ball" class="btn">
                <img src="ball.jpeg" alt="ball image">
            </button>

            <button id="stump" class="btn">
                <img src="stump.jpeg" alt="stump image">
            </button>
        </div>
        
        <div class="msg-container">
            <h3 id="user-move"></h3>
            <h3 id="computer-move"></h3>
            <h3 id="result"></h3>
            <h3 id="score"></h3>
        </div>
        <button id="reset">Reset</button>
    </div>

    <script src="scipt.js"></script>
</body>

</html>
